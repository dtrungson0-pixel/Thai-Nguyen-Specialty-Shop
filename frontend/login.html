<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 md:p-8">

            <span>Về Trang chủ</span>

        </div>

    <!-- Right Side: Login Form -->

        <div class="mb-10 text-center md:text-left">
            <a href="index.html" class="inline-block">
                <h1 class="font-headline-lg text-headline-lg text-secondary mb-2 hover:opacity-80 transition-opacity">Đặc Sản Thái Nguyên</h1>
            </a>
            <p class="font-body-md text-body-md text-on-surface-variant">Đăng nhập để tiếp tục khám phá.</p>
        </div>
        <form class="space-y-6">
            <!-- Email/Phone Input -->
            <div class="relative">
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="email">Email hoặc Số điện thoại</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant pl-2">person</span>
                    <input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary-container focus:ring-0 pl-10 py-2 font-body-md text-body-md text-on-surface transition-colors" id="email" placeholder="Nhập email hoặc số điện thoại" type="text"/>
                </div>
            </div>
            <!-- Password Input -->
            <div class="relative">
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 flex justify-between" for="password">
                    Mật khẩu
                    <a class="text-primary-container hover:text-primary transition-colors" href="#">Quên mật khẩu?</a>
                </label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant pl-2">lock</span>
                    <input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary-container focus:ring-0 pl-10 py-2 font-body-md text-body-md text-on-surface transition-colors" id="password" placeholder="Nhập mật khẩu" type="password"/>
                    <button class="absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors pr-2" type="button">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
            </div>
            <!-- Submit Button -->
            <button class="w-full bg-secondary text-on-secondary font-label-sm text-label-sm py-4 rounded hover:bg-on-secondary-container transition-colors shadow-[0_4px_14px_rgba(46,125,50,0.2)]" type="submit">
                Đăng nhập
            </button>
        </form>
        <div class="mt-8">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-outline-variant/30"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-surface-container-lowest text-on-surface-variant font-label-sm text-label-sm">Hoặc tiếp tục với</span>
